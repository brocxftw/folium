name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: folium
          POSTGRES_PASSWORD: folium
          POSTGRES_DB: folium
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U folium -d folium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install Python
        run: uv python install 3.13
      - name: Install deps
        # OCR extra (paddleocr) is Docker-only; unit tests mock the engine.
        run: uv venv --python 3.13 && uv pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check src tests || true
      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://folium:folium@localhost:5433/folium_test
          DATABASE_URL_SYNC: postgresql+psycopg://folium:folium@localhost:5433/folium_test
          FOLIUM_SECRET_KEY: ci-secret
          FOLIUM_ENCRYPTION_KEY: ci-encryption
          FOLIUM_ENV: test
          FOLIUM_ADMIN_USERNAME: admin
          FOLIUM_ADMIN_PASSWORD: testpass
          DOCUMENTS_PATH: /tmp/folium-ci/documents
          CONSUME_PATH: /tmp/folium-ci/consume
          EXPORT_PATH: /tmp/folium-ci/export
          FRONTEND_ORIGIN: http://test
        run: |
          mkdir -p /tmp/folium-ci/{documents,consume,export}
          docker run --rm --network host -e PGPASSWORD=folium pgvector/pgvector:pg17 \
            psql -h localhost -p 5433 -U folium -d postgres -c "CREATE DATABASE folium_test OWNER folium;" || true
          .venv/bin/alembic upgrade head || true
          DATABASE_URL=postgresql+asyncpg://folium:folium@localhost:5433/folium_test \
          DATABASE_URL_SYNC=postgresql+psycopg://folium:folium@localhost:5433/folium_test \
          .venv/bin/alembic upgrade head
          .venv/bin/pytest -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose config
