name: Publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            raw="${GITHUB_REF_NAME}"
          else
            raw="0.0.0-dev"
          fi
          version="${raw#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "is_tag=${{ github.ref_type == 'tag' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: backend_tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/brocxftw/folium-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-

      - id: web_tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/brocxftw/folium-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64
          load: true
          tags: ${{ steps.backend_tags.outputs.tags }}
          labels: ${{ steps.backend_tags.outputs.labels }}
          build-args: |
            FOLIUM_VERSION=${{ steps.meta.outputs.version }}
            FOLIUM_BUILD_REVISION=${{ steps.meta.outputs.revision }}
            FOLIUM_BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=folium-backend
          cache-to: type=gha,mode=max,scope=folium-backend

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          platforms: linux/amd64
          load: true
          tags: ${{ steps.web_tags.outputs.tags }}
          labels: ${{ steps.web_tags.outputs.labels }}
          build-args: |
            FOLIUM_VERSION=${{ steps.meta.outputs.version }}
            FOLIUM_BUILD_REVISION=${{ steps.meta.outputs.revision }}
            FOLIUM_BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=folium-web
          cache-to: type=gha,mode=max,scope=folium-web

      - name: Compose smoke test
        env:
          FOLIUM_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          cp docker-compose.yml "$smoke/docker-compose.yml"
          cat > "$smoke/.env" <<'EOF'
          FOLIUM_VERSION=${{ steps.meta.outputs.version }}
          FOLIUM_SECRET_KEY=ci-smoke-secret-not-for-production
          FOLIUM_ENCRYPTION_KEY=ci-smoke-encryption-not-for-production
          POSTGRES_USER=folium
          POSTGRES_PASSWORD=ci-smoke-postgres-not-for-production
          POSTGRES_DB=folium
          FOLIUM_ADMIN_USERNAME=admin
          FOLIUM_ADMIN_PASSWORD=ci-smoke-admin-not-for-production
          FRONTEND_ORIGIN=http://localhost:8080
          ALLOW_REGISTRATION=false
          FOLIUM_ENV=production
          AI_PRIVACY_MODE=local_only
          FOLIUM_DOCUMENTS_HOST=./data/documents
          FOLIUM_CONSUME_HOST=./data/consume
          FOLIUM_EXPORT_HOST=./data/export
          FOLIUM_PADDLE_CACHE_HOST=./data/paddleocr
          EOF
          mkdir -p "$smoke/data"/{documents,consume,export,paddleocr}
          chmod -R a+rwx "$smoke/data"
          cd "$smoke"
          docker compose -p folium-smoke up -d
          ok=0
          for _ in $(seq 1 48); do
            if curl -sf http://127.0.0.1:8000/health | grep -q '"status"'; then
              ok=1
              break
            fi
            sleep 5
          done
          docker compose -p folium-smoke ps
          if [[ "$ok" != 1 ]]; then
            docker compose -p folium-smoke logs
            exit 1
          fi
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8080/health
          docker compose -p folium-smoke down
          test -d "$smoke/data/documents"

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.backend_tags.outputs.tags }}
          labels: ${{ steps.backend_tags.outputs.labels }}
          build-args: |
            FOLIUM_VERSION=${{ steps.meta.outputs.version }}
            FOLIUM_BUILD_REVISION=${{ steps.meta.outputs.revision }}
            FOLIUM_BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=folium-backend

      - name: Push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web_tags.outputs.tags }}
          labels: ${{ steps.web_tags.outputs.labels }}
          build-args: |
            FOLIUM_VERSION=${{ steps.meta.outputs.version }}
            FOLIUM_BUILD_REVISION=${{ steps.meta.outputs.revision }}
            FOLIUM_BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=folium-web

      - name: GitHub Release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          sed "s/\${FOLIUM_VERSION:-latest}/\${FOLIUM_VERSION:-${VERSION}}/g" docker-compose.yml \
            > dist/docker-compose.yml
          sed "s/^FOLIUM_VERSION=.*/FOLIUM_VERSION=${VERSION}/" .env.example \
            > dist/env.example
          cp dist/env.example dist/default.env.example
          bash installer/pack.sh dist/install-folium.sh
          (cd dist && sha256sum \
            docker-compose.yml env.example default.env.example \
            install-folium.sh > checksums.txt)
          assets=(
            dist/docker-compose.yml
            dist/env.example
            dist/default.env.example
            dist/install-folium.sh
            dist/checksums.txt
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Folium v${VERSION}" \
              --generate-notes \
              "${assets[@]}"
          fi
