services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: folium
      POSTGRES_PASSWORD: folium
      POSTGRES_DB: folium
    volumes:
      - folium_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folium -d folium"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Keep Postgres on local Docker volume — never on NFS

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://folium:folium@db:5432/folium
      DATABASE_URL_SYNC: postgresql+psycopg://folium:folium@db:5432/folium
      DOCUMENTS_PATH: /documents
      CONSUME_PATH: /consume
      EXPORT_PATH: /export
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    volumes:
      - ${FOLIUM_DOCUMENTS_HOST:-./data/documents}:/documents
      - ${FOLIUM_CONSUME_HOST:-./data/consume}:/consume
      - ${FOLIUM_EXPORT_HOST:-./data/export}:/export
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    user: "1000:1000"
    # CIFS share is mode 0770 owned by group lxc_shares (gid 10000)
    group_add:
      - "10000"
    read_only: false
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: ["folium-worker"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://folium:folium@db:5432/folium
      DATABASE_URL_SYNC: postgresql+psycopg://folium:folium@db:5432/folium
      DOCUMENTS_PATH: /documents
      CONSUME_PATH: /consume
      EXPORT_PATH: /export
    volumes:
      - ${FOLIUM_DOCUMENTS_HOST:-./data/documents}:/documents
      - ${FOLIUM_CONSUME_HOST:-./data/consume}:/consume
      - ${FOLIUM_EXPORT_HOST:-./data/export}:/export
    user: "1000:1000"
    group_add:
      - "10000"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  folium_pgdata:
