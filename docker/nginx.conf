server {
    listen 80;
    server_name _;
    client_max_body_size 110m;

    root /usr/share/nginx/html;
    index index.html;

    # Browsers refuse ES module imports unless .mjs is served as JavaScript.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;

    # Docker embedded DNS. Variable proxy_pass forces re-resolution so a
    # recreated api container is not stuck behind a stale upstream IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $folium_api http://api:8000;

    location /api/ {
        proxy_pass $folium_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass $folium_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass $folium_api/openapi.json;
    }

    location /docs {
        proxy_pass $folium_api/docs;
    }

    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
